[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niibot-studio"
# Single source of truth: niibot/version.py — bumping it there is enough.
dynamic = ["version"]
description = "Local Niimbot B1 label printing over Bluetooth LE with a browser designer and a Windows print queue"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ussdeveloper" }]
keywords = ["niimbot", "thermal-printer", "bluetooth-le", "labels", "ipp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "bleak>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.2",
    "qrcode>=8.0",
    "python-barcode>=0.15",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/ussdeveloper/niibot-ble-app"
Changelog = "https://github.com/ussdeveloper/niibot-ble-app/blob/main/CHANGELOG.md"

[project.scripts]
niibot = "niibot.cli:main"

[tool.setuptools]
packages = ["niibot"]

[tool.setuptools.dynamic]
version = { attr = "niibot.version.__version__" }

[tool.setuptools.package-data]
niibot = ["py.typed"]
