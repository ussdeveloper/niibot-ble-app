<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fcff">
<meta name="color-scheme" content="light">
<title>Niibot Studio — Niimbot B1 label printer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/lucide.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>

<!-- menubar -->
<header class="menubar" id="menubar">
  <div class="menu-brand">
    <i data-lucide="printer"></i>
    <span>Niibot <b>Studio</b></span>
  </div>
  <nav class="menu-items">
    <button class="menu-item" data-menu="file">File</button>
    <button class="menu-item" data-menu="edit">Edit</button>
    <button class="menu-item" data-menu="view">View</button>
    <button class="menu-item" data-menu="settings">Settings</button>
    <button class="menu-item" data-menu="help">Help</button>
  </nav>
  <div class="menu-spacer"></div>
  <button class="lang-button" id="lang-button" title="Language">
    <span class="lang-flag" id="lang-flag">🇬🇧</span>
    <i data-lucide="chevron-down"></i>
  </button>
  <div class="menu-conn" id="menu-conn" title="Connection state">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-text">not connected</span>
  </div>
</header>
<div class="menu-dropdown" id="menu-dropdown" hidden></div>

<!-- shell -->
<div class="shell">

  <!-- left toolbar (VS Code activity bar) -->
  <nav class="activity-bar" id="activity-bar">
    <button data-add="text" title="Text"><i data-lucide="type"></i></button>
    <button data-add="barcode" title="Barcode"><i data-lucide="barcode"></i></button>
    <button data-add="qr" title="QR code"><i data-lucide="qr-code"></i></button>
    <button data-add="rect" title="Frame"><i data-lucide="square"></i></button>
    <button data-add="line" title="Line"><i data-lucide="minus"></i></button>
    <button data-add="image" title="Image"><i data-lucide="image"></i></button>
    <button id="btn-icons" title="Icons &amp; cliparts (Lucide, Material)"><i data-lucide="shapes"></i></button>
    <div class="ab-sep"></div>
    <button id="btn-undo" title="Undo (Ctrl+Z)"><i data-lucide="undo-2"></i></button>
    <button id="btn-redo" title="Redo (Ctrl+Y)"><i data-lucide="redo-2"></i></button>
    <div class="ab-sep"></div>
    <button id="btn-save" title="Save label (Ctrl+S)"><i data-lucide="save"></i></button>
    <button id="btn-open" title="Load label"><i data-lucide="folder-open"></i></button>
    <button id="btn-png" title="Export PNG"><i data-lucide="download"></i></button>
    <div class="ab-sep"></div>
    <button id="btn-print" class="accent" title="Print (Ctrl+P)"><i data-lucide="printer"></i></button>
    <div class="ab-sep"></div>
    <button id="btn-grid" class="toggle" title="Grid on label (G)"><i data-lucide="grid-3x3"></i></button>
    <button id="btn-snap" class="toggle active" title="Snap to grid (S)"><i data-lucide="magnet"></i></button>
    <div class="ab-spacer"></div>
    <button id="btn-settings" title="Settings"><i data-lucide="settings"></i></button>
  </nav>

  <!-- work area -->
  <main class="workbench">
    <div class="editor">
      <div class="stage-meta" id="stage-meta"></div>

      <div class="canvas-wrap" id="canvas-wrap">
        <div class="paper-column" id="paper-column">
          <div class="stage" id="stage">
            <img id="preview" alt="Label preview">
            <div id="grid-layer" class="grid-layer" hidden></div>
            <div id="paper-regions"></div>
            <div id="guides" class="guides"></div>
            <div id="overlay"></div>
          </div>
          <div class="gap-preview" id="gap-preview"><span id="gap-preview-label">gap</span></div>
        </div>
      </div>

      <!-- data sheet view -->
      <div class="splitter-h" id="splitter-sheet" hidden title="Drag to show both views · double-click for full height"></div>
      <div class="sheet-pane" id="sheet-pane" hidden>
        <div class="sheet-toolbar">
          <button class="btn" id="sheet-add-row"><i data-lucide="table-row-insert-bottom"></i> Row</button>
          <button class="btn" id="sheet-add-column"><i data-lucide="table-column-insert-right"></i> Column</button>
          <button class="btn" id="sheet-import"><i data-lucide="file-spreadsheet"></i> Import</button>
          <input type="file" id="sheet-file" accept=".xlsx,.xlsm,.csv,.txt" hidden>
          <select class="sheet-select" id="sheet-sort" title="Sort rows by column">
            <option value="">Sort…</option>
          </select>
          <button class="btn" id="sheet-sort-dir" title="Sort direction"><i data-lucide="arrow-down-a-z"></i></button>
          <label class="sheet-toggle" id="sheet-mirror-wrap" title="Fill the remaining label regions with a copy of the first one">
            <input type="checkbox" id="sheet-mirror"><span>Mirror</span>
          </label>
          <label class="sheet-toggle" id="sheet-flip-wrap" title="Second region as a vertical flip instead of a copy">
            <input type="checkbox" id="sheet-flip"><span>flip</span>
          </label>
          <div class="sheet-spacer"></div>
          <button class="btn" id="sheet-clear"><i data-lucide="eraser"></i> Clear</button>
          <button class="btn primary" id="sheet-print"><i data-lucide="printer"></i> Print sheet</button>
        </div>
        <div class="sheet-scroll" id="sheet-scroll">
          <table class="sheet-table" id="sheet-table"></table>
        </div>
        <div class="sheet-hint" id="sheet-hint"></div>
      </div>

      <!-- floating toolbar above the work area -->
      <div class="floating-toolbar" id="floating-toolbar" hidden>
        <span class="ft-label" id="ft-label">element</span>
        <div class="ft-sep"></div>
        <button data-ft="align-h" title="Centre horizontally"><i data-lucide="align-center-horizontal"></i></button>
        <button data-ft="align-v" title="Centre vertically"><i data-lucide="align-center-vertical"></i></button>
        <button data-ft="rotate" title="Rotate 90°"><i data-lucide="rotate-cw"></i></button>
        <button data-ft="up" title="Move up"><i data-lucide="chevron-up"></i></button>
        <button data-ft="down" title="Move down"><i data-lucide="chevron-down"></i></button>
        <div class="ft-sep"></div>
        <button data-ft="duplicate" title="Duplicate (Ctrl+D)"><i data-lucide="copy"></i></button>
        <button data-ft="delete" class="danger" title="Delete (Del)"><i data-lucide="trash-2"></i></button>
      </div>

      <div class="warnings" id="warnings"></div>
    </div>

    <!-- status bar -->
    <footer class="statusbar">
      <button class="sb-item" id="sb-conn" title="Connection">
        <i data-lucide="bluetooth"></i><span id="sb-conn-text">not connected</span>
      </button>
      <div class="sb-item" id="sb-paper" title="Paper &amp; roll">
        <i data-lucide="tag"></i><span id="sb-paper-text">no data</span>
      </div>
      <div class="sb-item" id="sb-format" title="Label format">
        <i data-lucide="crop"></i><span id="sb-format-text">—</span>
      </div>
      <div class="sb-spacer"></div>
      <div class="sb-item sb-job" id="sb-job" hidden>
        <div class="sb-progress"><div id="sb-progress-bar"></div></div>
        <span id="sb-job-text">—</span>
      </div>
      <div class="sb-item" id="sb-temp" title="Printhead temperature"></div>
      <div class="sb-item sb-muted" id="sb-db" title="Database">SQLite</div>
    </footer>
  </main>

  <!-- right panel: properties + layers -->
  <aside class="panel">
    <header class="panel-title">
      <i data-lucide="sliders-horizontal"></i><span>Properties</span>
      <div class="editor-tabs" id="editor-tabs" role="tablist">
        <button class="editor-tab active" data-view="design" role="tab" title="Design view">
          <i data-lucide="layout-template"></i><span>Design</span>
        </button>
        <button class="editor-tab" data-view="sheet" role="tab" title="Sheet view">
          <i data-lucide="table-2"></i><span>Sheet</span>
        </button>
      </div>
    </header>
    <div class="panel-body" id="inspector-card">
      <div class="panel-empty">Select an element on the label to edit it.</div>
    </div>
    <header class="panel-title"><i data-lucide="layers"></i><span>Items</span>
      <span class="panel-count" id="layer-count">0</span>
    </header>
    <div class="panel-body panel-layers" id="layer-list"></div>
    <div class="panel-toolbar">
      <button id="layer-up" title="Move up"><i data-lucide="chevron-up"></i></button>
      <button id="layer-down" title="Move down"><i data-lucide="chevron-down"></i></button>
      <span class="pt-sep"></span>
      <button id="layer-duplicate" title="Duplicate (Ctrl+D)"><i data-lucide="copy"></i></button>
      <button id="layer-delete" class="danger" title="Delete (Del)"><i data-lucide="trash-2"></i></button>
    </div>
    <div class="splitter-h queue-splitter" id="splitter-queue" title="Drag to resize the printer queue · double-click to reset"></div>
    <header class="panel-title">
      <i data-lucide="list-ordered"></i><span>Printer queue</span>
      <span class="panel-count" id="queue-count">0</span>
    </header>
    <div class="panel-body panel-queue" id="queue-list"></div>
  </aside>

  <div class="panel-resizer" id="panel-resizer" title="Drag to resize the panel"></div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="file-input" accept="image/*" hidden>

</body>
</html>
